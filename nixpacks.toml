# Railway / Nixpacks — garante gunicorn após pip install -r requirements.txt
[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "python manage.py migrate --noinput && python manage.py seed_playhub && python manage.py seed_roleta && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
